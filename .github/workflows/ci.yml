name: contracts

# The gate for the one repository that defines every wire type. A lint rule with no job running
# it is inert, which is why moneylint and this workflow landed together rather than one before
# the other.
#
# Three things are checked, and the third is the one that matters most over time:
#
#   lint      — the standard rules plus moneylint, which fails a build on a float money field
#   format    — so a diff is a change in meaning, never a reflow
#   breaking  — against the main branch, so a field number cannot be reused or a type widened
#               without it being deliberate. Eight language packages are generated from this
#               module; a silent breaking change becomes eight silent breaking changes.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # Built from source in this repository, not pulled from a registry: the rule and the
      # contract it guards version together, and a plugin fetched by tag could drift from the
      # module it is supposed to be checking.
      - name: Build moneylint
        working-directory: tools/moneylint
        run: |
          go build -o moneylint .
          test -x moneylint

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Lint
        run: buf lint

      - name: Format
        run: buf format --diff --exit-code

  breaking:
    runs-on: ubuntu-latest
    # Nothing to compare against on the first push to an empty branch.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # On a pull_request, actions/checkout leaves a detached HEAD whose only reference to the base
      # is `origin/main`; there is no local branch called `main`. buf's `.git#branch=main` looks
      # for exactly that name, so this job failed every single time it ran, with
      # `fatal: couldn't find remote ref main` — an infrastructure error wearing the costume of a
      # contract check. Verified 2026-09-17 against the run history: it had never once compared
      # anything, and because nothing blocked a red merge, every PR went in past it.
      - name: Make main resolvable locally
        run: git fetch --no-tags origin main:main

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # buf.yaml declares moneylint under a module-level `plugins:`, so *every* buf command loads
      # it — `breaking` included, though it runs no lint rule. Only the `lint` job built the
      # binary, so as soon as the fix above let this job reach the module at all it died on
      # `fork/exec ./tools/moneylint/moneylint: no such file or directory`.
      #
      # Two failures, one cause: a gate that has never run cannot tell you what it needs.
      - name: Build moneylint
        working-directory: tools/moneylint
        run: go build -o moneylint .

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      # Not `buf breaking` directly: the gate reads docs/BREAKING.md, so a break that is written
      # down passes and a break that is not fails naming itself. See tools/breaking-gate.
      - name: Breaking change check against main
        run: tools/breaking-gate --against ".git#branch=main"

  manifests:
    runs-on: ubuntu-latest
    # A packaging manifest is the one file in this repository that no proto lint reads and no
    # test imports, so a mistake in one is invisible until a registry serves it.
    #
    # This job exists because of a specific one. The reasoning behind the google/protobuf
    # constraint was written as an entry inside `require`, where Composer parses every value as a
    # version constraint. Five tags shipped a package that could not be loaded at all, and only a
    # separate bug — Packagist never crawling the split repository — kept anyone from installing
    # it. `composer validate --strict` rejects it in under a second.
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: The published manifest must be loadable
        working-directory: packaging/composer
        run: composer validate --strict --no-check-publish --no-check-lock

      - name: The development manifest must be loadable
        run: composer validate --strict --no-check-publish --no-check-lock

  moneylint-self-test:
    runs-on: ubuntu-latest
    # A lint rule that has never been seen to fail is not a lint rule. This job feeds moneylint
    # a file that violates both rules and fails if the plugin stays silent — so the gate itself
    # is gated.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build moneylint
        working-directory: tools/moneylint
        run: go build -o moneylint .

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: moneylint must reject a float money field
        run: |
          mkdir -p /tmp/selftest/proto/selftest/v1
          cd /tmp/selftest
          cp "$GITHUB_WORKSPACE/buf.yaml" .
          mkdir -p tools/moneylint
          cp "$GITHUB_WORKSPACE/tools/moneylint/moneylint" tools/moneylint/
          cat > proto/selftest/v1/selftest.proto <<'PROTO'
          syntax = "proto3";
          package selftest.v1;
          message Violation {
            double total_amount = 1;
          }
          PROTO
          if buf lint; then
            echo "moneylint accepted a double money field — the rule is not running"
            exit 1
          fi
          echo "moneylint rejected it, as required"

  breaking-gate-self-test:
    runs-on: ubuntu-latest
    # The register in docs/BREAKING.md is a door in the breaking gate, and a door has to be shown
    # to close. The job above proves buf still reports a breaking change; this one proves the
    # register cannot wave one through that nobody wrote down.
    #
    # It deletes a file the register says nothing about. The gate must refuse and name it — if it
    # passed, "declared" would mean "declared anything", and the door would be a hole.
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Make main resolvable locally
        run: git fetch --no-tags origin +refs/heads/main:refs/heads/main || true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build moneylint
        working-directory: tools/moneylint
        run: go build -o moneylint .

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: The register must not excuse an undeclared break
        run: |
          victim=proto/geo/v1/geo.proto
          test -f "$victim" || { echo "$victim is gone; pick another victim for this test"; exit 1; }
          rm "$victim"

          if tools/breaking-gate --against ".git#branch=main" > gate.out 2>&1; then
            echo "the gate accepted a deleted .proto that no version declares:"
            cat gate.out
            exit 1
          fi

          grep -q "NOT DECLARED" gate.out || {
            echo "the gate refused, but not for the reason this test is about:"
            cat gate.out
            exit 1
          }
          echo "the gate refused it and named it, as required"

  breaking-self-test:
    runs-on: ubuntu-latest
    # The `breaking` job above was red for its entire life and nobody knew: it failed first on
    # `couldn't find remote ref main`, then on a missing moneylint binary, both infrastructure
    # errors wearing the costume of a contract check. It went green on 2026-09-17 — which proves it
    # RUNS, not that it BITES.
    #
    # Same argument as moneylint-self-test, one job above: a gate that has never been seen to fail
    # is not a gate. This feeds buf a change that is unambiguously breaking and fails if buf stays
    # silent.
    #
    # Deleting a whole file rather than retyping a field, deliberately: FILE_NO_DELETE cannot rot
    # as the protos are edited, while a sed against some specific field would quietly stop matching
    # and take this assurance with it.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      # buf.yaml declares moneylint at module level, so every buf command loads it — including
      # breaking, which runs no lint rule at all.
      - name: Build moneylint
        working-directory: tools/moneylint
        run: go build -o moneylint .

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: buf breaking must reject a deleted file
        run: |
          mutant="$(mktemp -d)"
          cp -R proto buf.yaml "$mutant/"
          mkdir -p "$mutant/tools/moneylint"
          cp tools/moneylint/moneylint "$mutant/tools/moneylint/"

          victim=proto/geo/v1/geo.proto
          test -f "$mutant/$victim" || { echo "$victim is gone; pick another victim for this test"; exit 1; }
          rm "$mutant/$victim"

          cd "$mutant"
          if buf breaking --against "$GITHUB_WORKSPACE"; then
            echo "buf accepted a deleted .proto — the breaking gate is not comparing anything"
            exit 1
          fi
          echo "buf rejected it, as required"

      # The other half of the same claim: with nothing changed, it must PASS. A check that fails on
      # everything is as useless as one that fails on nothing, and would hide behind the test above.
      - name: buf breaking must accept an identical module
        run: |
          twin="$(mktemp -d)"
          cp -R proto buf.yaml "$twin/"
          mkdir -p "$twin/tools/moneylint"
          cp tools/moneylint/moneylint "$twin/tools/moneylint/"

          cd "$twin"
          buf breaking --against "$GITHUB_WORKSPACE"
          echo "an unchanged module passed, as required"
