# Managed mode: no .proto in this module carries a per-language option, ever.
#
# That is not a style preference. The six vendored copies of common/v1 diverged partly because
# each service repo edited the language options in its own copy — go_package here,
# csharp_namespace there — so the files could no longer be compared, and a real change to a
# field looked the same as someone adjusting their own namespace. Language options are a
# property of the generated package, not of the contract, so they live here.
version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/WildanFrananda/kinetix-contracts/gen/go
    - file_option: java_package_prefix
      value: com.kinetix.contracts
    - file_option: csharp_namespace_prefix
      value: Kinetix.Contracts
    - file_option: objc_class_prefix
      value: KNX
    # No ruby_package or php_namespace override: buf has no *_prefix form for either, and a
    # single fixed value would give all ten packages the same namespace and collide. Managed
    # mode derives both from the proto package, which is what we want anyway.

# One plugin pair per stack that consumes gRPC. Eight languages, from one tag.
#
# Remote plugins, not local binaries: generating eight languages locally means installing eight
# protoc plugin toolchains and keeping them in step, and a version skew between two developers'
# machines produces two different packages from the same .proto — which is the class of problem
# this repository exists to remove.
#
# Every version is pinned. An unpinned plugin means the package published on Tuesday can differ
# from the one published on Monday with no change to the contract.
plugins:
  # TypeScript — kinetix-identity-service (NestJS/Bun) → npm
  - remote: buf.build/bufbuild/es:v2.2.3
    out: gen/ts/src
    opt:
      # `target=js` plus `target=dts`, not `target=ts`. The npm package ships runnable
      # JavaScript and its declarations; `.ts` would need a compile step the publish job does
      # not have — and did not have, which is how v1.0.0 went out as 368 bytes of package.json
      # and nothing else. npm reported success.
      - target=js+dts

  # Python — kinetix-catalog-service (Django) → PyPI
  - remote: buf.build/protocolbuffers/python:v29.3
    out: gen/python
  - remote: buf.build/grpc/python:v1.67.0
    out: gen/python

  # C# — kinetix-order-service (.NET) → NuGet
  - remote: buf.build/protocolbuffers/csharp:v29.3
    out: gen/csharp
  - remote: buf.build/grpc/csharp:v1.67.0
    out: gen/csharp

  # Java — kinetix-payment-service (Spring Boot) → Maven Central
  - remote: buf.build/protocolbuffers/java:v29.3
    out: gen/java
  - remote: buf.build/grpc/java:v1.68.1
    out: gen/java

  # Ruby — kinetix-warehouse-service (Rails) → RubyGems
  - remote: buf.build/protocolbuffers/ruby:v29.3
    out: gen/ruby
  - remote: buf.build/grpc/ruby:v1.67.0
    out: gen/ruby

  # PHP — kinetix-review-service (Laravel) → Packagist
  - remote: buf.build/protocolbuffers/php:v29.3
    out: gen/php
  - remote: buf.build/grpc/php:v1.67.0
    out: gen/php

  # Go — no service uses it today, but the moneylint plugin and any future tooling do, and it
  # is the reference generation everything else is compared against.
  - remote: buf.build/protocolbuffers/go:v1.36.3
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: gen/go
    opt:
      - paths=source_relative

# Rust (kinetix-pricing-service) and Elixir (kinetix-matching-service) are generated by their own
# toolchains rather than a buf remote plugin: tonic-build and protoc-gen-elixir both run from the
# consuming project's build, and neither has a maintained remote plugin. CTR-04's publish job
# vendors the .proto files into those two packages instead of generated code, which is why
# crates.io and Hex are still in the eight.
