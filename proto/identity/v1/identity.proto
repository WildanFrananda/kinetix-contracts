syntax = "proto3";

package identity.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

service IdentityService {
  rpc ResolvePrincipal(ResolvePrincipalRequest) returns (ResolvePrincipalResponse);
  rpc GetPrincipal(GetPrincipalRequest) returns (GetPrincipalResponse);
  rpc GetUserProfile(GetUserProfileRequest) returns (GetUserProfileResponse);
  rpc GetMerchantInfo(GetMerchantInfoRequest) returns (GetMerchantInfoResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc MerchantsChangedSince(MerchantsChangedSinceRequest) returns (MerchantsChangedSinceResponse);
}

enum PrincipalKind {
  PRINCIPAL_KIND_UNSPECIFIED = 0;
  PRINCIPAL_KIND_CUSTOMER = 1;
  PRINCIPAL_KIND_MERCHANT = 2;
  PRINCIPAL_KIND_DRIVER = 3;
  PRINCIPAL_KIND_STAFF = 4;
  PRINCIPAL_KIND_SERVICE = 5;
}

message ServiceLocalId {
  string service = 1;
  string local_id = 2;
}

message ResolvePrincipalRequest {
  ServiceLocalId service_local_id = 1;
}

message ResolvePrincipalResponse {
  bool found = 1;
  string principal_id = 2;
  PrincipalKind kind = 3;
  string display_name = 4;
}

message GetPrincipalRequest {
  string principal_id = 1;
}

message GetPrincipalResponse {
  bool found = 1;
  string principal_id = 2;
  PrincipalKind kind = 3;
  string display_name = 4;
  repeated ServiceLocalId aliases = 5;
}

message GetUserProfileRequest {
  string principal_id = 1;
}

message GetUserProfileResponse {
  bool found = 1;
  string principal_id = 2;
  string email = 3;
  string full_name = 4;
  string phone_number = 5;
  string street_address = 6;
  string city = 7;
  string postal_code = 8;
  PrincipalKind kind = 9;
  bool has_location = 10;
  common.v1.GeoPoint location = 11;
}

message GetMerchantInfoRequest {
  string principal_id = 1;
}

message GetMerchantInfoResponse {
  bool found = 1;
  string merchant_principal_id = 2;
  string store_name = 3;
  string business_registration_number = 4;
  string tax_id = 5;
  MerchantStatus status = 6;
  common.v1.Address pickup_address = 7;
  bool has_location = 8;
  common.v1.GeoPoint location = 9;
  bool may_sell = 10;
}

enum MerchantStatus {
  MERCHANT_STATUS_UNSPECIFIED = 0;
  MERCHANT_STATUS_PENDING = 1;
  MERCHANT_STATUS_VERIFIED = 2;
  MERCHANT_STATUS_SUSPENDED = 3;
  MERCHANT_STATUS_CLOSED = 4;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string principal_id = 2;
  PrincipalKind kind = 3;
  string reason = 4;
}

message MerchantCursor {
  google.protobuf.Timestamp updated_through = 1;
  string last_principal_id = 2;
}

message MerchantRecord {
  string principal_id = 1;
  string store_name = 2;
  MerchantStatus status = 3;
  bool may_sell = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message MerchantsChangedSinceRequest {
  MerchantCursor cursor = 1;
  int32 limit = 2;
}

message MerchantsChangedSinceResponse {
  repeated MerchantRecord upserted = 1;
  repeated string removed_principal_ids = 2;
  MerchantCursor next = 3;
  bool has_more = 4;
}
