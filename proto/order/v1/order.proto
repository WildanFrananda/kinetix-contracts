syntax = "proto3";

package order.v1;

import "common/v1/common.proto";

service OrderService {
  rpc GetOrderDetails(GetOrderDetailsRequest) returns (GetOrderDetailsResponse);
  rpc ListOrdersForPrincipal(ListOrdersForPrincipalRequest) returns (ListOrdersForPrincipalResponse);
  rpc FulfillmentPacked(FulfillmentPackedRequest) returns (FulfillmentPackedResponse);
  rpc OrderDelivered(OrderDeliveredRequest) returns (OrderDeliveredResponse);
  rpc OpenReturn(OpenReturnRequest) returns (OpenReturnResponse);
  rpc ReturnGoodsReceived(ReturnGoodsReceivedRequest) returns (ReturnGoodsReceivedResponse);
}

enum ReturnStatus {
  RETURN_STATUS_UNSPECIFIED = 0;
  RETURN_STATUS_OPEN = 1;
  RETURN_STATUS_GOODS_RECEIVED = 2;
  RETURN_STATUS_RESOLVED = 3;
  RETURN_STATUS_REJECTED = 4;
}

message OpenReturnRequest {
  string order_number = 1;
  string merchant_principal_id = 2;
  string reason = 3;
  common.v1.IdempotencyKey idempotency_key = 4;
}

message OpenReturnResponse {
  bool success = 1;
  string return_number = 2;
  ReturnStatus status = 3;
  bool already_open = 4;
  common.v1.ErrorDetail error = 5;
}

message ReturnedLine {
  string sku = 1;
  int32 quantity = 2;
}

message ReturnGoodsReceivedRequest {
  string return_number = 1;
  string merchant_principal_id = 2;
  repeated ReturnedLine lines = 3;
  string bin_code = 4;
  string received_at = 5;
  common.v1.IdempotencyKey idempotency_key = 6;
}

message ReturnGoodsReceivedResponse {
  bool accepted = 1;
  bool already_recorded = 2;
  ReturnStatus status = 3;
  common.v1.ErrorDetail error = 4;
}

message OrderDeliveredRequest {
  string order_number = 1;
  string driver_principal_id = 2;
  string delivered_at = 3;
}

message OrderDeliveredResponse {
  bool accepted = 1;
  bool already_delivered = 2;
  common.v1.ErrorDetail error = 3;
}

message FulfillmentPackedRequest {
  string merchant_principal_id = 1;
  string order_number = 2;
  string fulfillment_task_id = 3;
}

message FulfillmentPackedResponse {
  bool success = 1;
  bool already_packed = 2;
  string dispatch_ref = 3;
  common.v1.ErrorDetail error = 4;
}

message GetOrderDetailsRequest {
  string order_id = 1;
}

message OrderLine {
  string product_id = 1;
  string product_title = 2;
  common.v1.Money unit_price = 3;
  int32 quantity = 4;
  common.v1.Money line_subtotal = 5;
}

message GetOrderDetailsResponse {
  bool found = 1;
  string order_id = 2;
  string order_number = 3;
  string customer_principal_id = 4;
  common.v1.OrderStatus status = 5;
  common.v1.Money subtotal = 6;
  common.v1.Money discount_amount = 7;
  common.v1.Money shipping_fee = 8;
  common.v1.Money final_total = 9;
  repeated OrderLine lines = 10;
  common.v1.Address shipping_address = 11;
}

message ListOrdersForPrincipalRequest {
  string principal_id = 1;
  common.v1.OrderStatus status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListOrdersForPrincipalResponse {
  repeated GetOrderDetailsResponse orders = 1;
  int32 total_count = 2;
}
